name: Build APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        # Nev Launcher: "all" = 1 APK universal (arm64-v8a, armeabi-v7a, x86, x86_64)
        arch: ["all"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble${{ inputs.variant }} -Darch=${{ matrix.arch }}

      - name: Delete previous debug APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          # Remove only older debug APK artifacts, leaving unrelated workflow artifacts alone.
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            -q '.artifacts[] | select(.name | startswith("debug apk")) | .id' |
          while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/$REPO/actions/artifacts/$id" || true
          done

          # Remove completed runs belonging to this push-build workflow only.
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            -q ".workflow_runs[] | select(.id != ($CURRENT_RUN | tonumber) and .status == \"completed\" and .path == \".github/workflows/push_ci.yml\") | .id" |
          while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
          done

      - name: Upload Debug APK for ${{ matrix.arch }}
        if: inputs.variant == 'Debug' || inputs.variant == 'Fast'
        uses: actions/upload-artifact@v7
        with:
          name: debug apk (${{ matrix.arch }})
          path: |
            ZalithLauncher/build/outputs/apk/debug/*.apk
            ZalithLauncher/build/outputs/apk/fast/*.apk
          if-no-files-found: error
          retention-days: 90
